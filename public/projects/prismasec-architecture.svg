    <g transform="translate(420 225)"><rect width="280" height="150" rx="8" fill="#171a1f" stroke="#00cffc"/><text x="28" y="48" fill="#00cffc" font-size="17" font-weight="700">PLATFORM</text><text x="28" y="83" fill="#f6f6fc" font-size="23" font-weight="700">Next.js + PostgreSQL</text><text x="28" y="116" fill="#aaabb0" font-size="16">Identity · Tenancy · Product</text></g>
    <g transform="translate(790 225)"><rect width="280" height="150" rx="8" fill="#171a1f" stroke="#ac89ff"/><text x="28" y="48" fill="#ac89ff" font-size="17" font-weight="700">SERVICE BOUNDARY</text><text x="28" y="83" fill="#f6f6fc" font-size="23" font-weight="700">Authenticated requests</text><text x="28" y="116" fill="#aaabb0" font-size="16">Authorization · Contracts</text></g>
    <g transform="translate(1160 225)"><rect width="200" height="150" rx="8" fill="#171a1f" stroke="#9cff93"/><text x="24" y="48" fill="#9cff93" font-size="17" font-weight="700">CTEM ENGINE</text><text x="24" y="83" fill="#f6f6fc" font-size="23" font-weight="700">Rust services</text><text x="24" y="116" fill="#aaabb0" font-size="16">Cycles · Workers</text></g>
    <g stroke="url(#line)" stroke-width="4" fill="none" filter="url(#glow)"><path d="M330 300h90"/><path d="M700 300h90"/><path d="M1070 300h90"/></g>
    <g transform="translate(245 520)"><rect width="280" height="145" rx="8" fill="#171a1f" stroke="#00cffc"/><text x="28" y="48" fill="#00cffc" font-size="17" font-weight="700">EXPOSURE DATA</text><text x="28" y="83" fill="#f6f6fc" font-size="23" font-weight="700">SurrealDB</text><text x="28" y="116" fill="#aaabb0" font-size="16">Graph · Findings · Retests</text></g>
    <g transform="translate(580 520)"><rect width="280" height="145" rx="8" fill="#171a1f" stroke="#9cff93"/><text x="28" y="48" fill="#9cff93" font-size="17" font-weight="700">CONTROLLED EXECUTION</text><text x="28" y="83" fill="#f6f6fc" font-size="23" font-weight="700">Isolated workers</text><text x="28" y="116" fill="#aaabb0" font-size="16">Authorized assessment jobs</text></g>
    <g transform="translate(915 520)"><rect width="280" height="145" rx="8" fill="#171a1f" stroke="#ac89ff"/><text x="28" y="48" fill="#ac89ff" font-size="17" font-weight="700">ACTIONABLE OUTPUT</text><text x="28" y="83" fill="#f6f6fc" font-size="23" font-weight="700">Risk · Reports · Retests</text><text x="28" y="116" fill="#aaabb0" font-size="16">Evidence linked to action</text></g>
