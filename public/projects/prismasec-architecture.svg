<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized PrismaSec architecture</title>
  <desc id="desc">Flow from verified public assets through the Next.js platform and an authenticated service boundary to the Rust CTEM engine, workers, data stores, reporting, and GitOps operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c0e12"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#9cff93"/><stop offset="1" stop-color="#00cffc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g opacity=".12" stroke="#74757a"><path d="M0 100h1440M0 200h1440M0 300h1440M0 400h1440M0 500h1440M0 600h1440M0 700h1440M0 800h1440"/><path d="M120 0v900M240 0v900M360 0v900M480 0v900M600 0v900M720 0v900M840 0v900M960 0v900M1080 0v900M1200 0v900M1320 0v900"/></g>
  <text x="80" y="82" fill="#9cff93" font-family="monospace" font-size="20" letter-spacing="5">PRISMASEC // SANITIZED SYSTEM VIEW</text>
  <text x="80" y="128" fill="#f6f6fc" font-family="Arial, sans-serif" font-size="38" font-weight="700">From verified scope to remediation evidence</text>
  <g font-family="Arial, sans-serif">
