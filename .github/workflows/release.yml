name: Publish
on:
  workflow_run:
    workflows: [Verify]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      portfolio: ${{ steps.plan.outputs.portfolio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/common.py publish-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: publication-plan
          overwrite: true
          path: verification.json
          if-no-files-found: error
          retention-days: 90
  portfolio:
    needs: candidate
    if: needs.candidate.outputs.portfolio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: publish-portfolio
      cancel-in-progress: false
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: docker-container
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/rstride/prismasite-portfolio:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rstride/portfolio
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=ghcr.io/rstride/prismasite-portfolio:buildcache
          cache-to: type=registry,ref=ghcr.io/rstride/prismasite-portfolio:buildcache,mode=max
      - id: ref
        run: echo "image=ghcr.io/rstride/prismasite-portfolio@${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
      - name: Scan and smoke exact candidate
        run: bash .github/ci/image-check.sh "${{ steps.ref.outputs.image }}" portfolio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('portfolio-image-scan.json') != ''
        with:
          name: portfolio-image-scan
          overwrite: true
          path: portfolio-image-scan.json
          if-no-files-found: error
          retention-days: 90
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - run: cosign sign --yes "${{ steps.ref.outputs.image }}"
  publication-result:
    needs: [candidate, portfolio]
    if: always() && needs.candidate.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.*.result, 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: publication-plan
      - name: Compose release evidence
        if: needs.portfolio.result == 'success'
        env:
          RELEASE_IMAGES: '{"portfolio": "${{ needs.portfolio.outputs.image }}"}'
        run: python3 .github/ci/common.py release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && (needs.portfolio.result == 'success')
        with:
          name: release
          path: release.json
          if-no-files-found: error
          retention-days: 90
