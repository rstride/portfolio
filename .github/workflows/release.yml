name: Release Portfolio Website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: rstride
      IMAGE_NAME: prismasite-portfolio
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Compose immutable image ref
        id: meta
        run: echo "image_ref=${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}@${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Sign image
        run: cosign sign --yes "${{ steps.meta.outputs.image_ref }}"

  promote-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout PrismaPlatform
        uses: actions/checkout@v4
        with:
          repository: rstride/PrismaPlatform
          ref: main
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
      - name: Update portfolio website digest
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
        run: |
          FILE="k8s/environments/production/manifests/websites.yaml"
          perl -0pi -e 's|(name: rstride-website\n(?:[ \t].*\n)*?[ \t]+image: ).*|${1}$ENV{IMAGE_REF}|' "$FILE"
      - name: Commit digest for GitOps sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/environments/production/manifests/websites.yaml
          git commit -m "release(rstride.fr): pin website image digest [skip ci]" || exit 0
          git push origin HEAD:main
