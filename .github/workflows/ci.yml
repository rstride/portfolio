name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      portfolio: ${{ steps.plan.outputs.portfolio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/common.py plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: verification-plan
          overwrite: true
          path: verification.json
          if-no-files-found: error
          retention-days: 90
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/ci/check-workflows.py
  portfolio:
    needs: changes
    if: needs.changes.outputs.portfolio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ./.nvmrc
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: Align npm
        working-directory: .
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test 2>&1 | tee test-results.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('test-results.log') != ''
        with:
          name: unit-test-log
          overwrite: true
          path: test-results.log
          retention-days: 14
      - run: npm run build
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
      - name: Dependency scan
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output dependency-scan.json package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('dependency-scan.json') != ''
        with:
          name: dependency-scan
          overwrite: true
          path: dependency-scan.json
          if-no-files-found: error
          retention-days: 90
  ci-result:
    name: CI result
    needs: [changes, policy, portfolio]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED: '["changes", "policy"]'
          CI_CHANGED: '{"portfolio": "${{ needs.changes.outputs.portfolio }}"}'
        run: python3 .github/ci/common.py result
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verification-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: verification
          overwrite: true
          path: verification.json
          if-no-files-found: error
          retention-days: 90
